<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Terminal - 관리자 로그인</title>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-darker: #0a0a0a;
      --bg-card: #1e1e1e;
      --bg-hover: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --text-tertiary: #808080;
      --accent: #ffcc00;
      --accent-hover: #ffd740;
      --green: #00c853;
      --red: #ff5252;
      --blue: #2196f3;
      --border-radius: 6px;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .login-container {
      background-color: var(--bg-card);
      padding: 40px;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      width: 100%;
      max-width: 400px;
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 15px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--text-primary);
      text-align: center;
    }
    
    p {
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 25px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      background-color: var(--bg-dark);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--border-radius);
      color: var(--text-primary);
      font-size: 16px;
    }
    
    .btn {
      width: 100%;
      background-color: var(--accent);
      color: var(--bg-darker);
      border: none;
      border-radius: var(--border-radius);
      padding: 12px 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .btn:hover {
      background-color: var(--accent-hover);
    }
    
    .error-message {
      color: var(--red);
      margin-top: 20px;
      padding: 10px;
      border-radius: var(--border-radius);
      background-color: rgba(255, 82, 82, 0.1);
      text-align: center;
      display: none;
    }
    
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-tertiary);
      text-decoration: none;
      font-size: 14px;
    }
    
    .back-link:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-container">
      <img src="https://i.ibb.co/NZ90MsS/at-logo.png" alt="Alpha Terminal Logo" class="logo">
      <h1>Alpha Terminal</h1>
      <p>관리자 접속</p>
    </div>
    
    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="관리자 비밀번호를 입력하세요">
    </div>
    
    <button class="btn" id="login-btn">로그인</button>
    
    <div class="error-message" id="error-message">
      비밀번호가 올바르지 않습니다. 다시 시도해주세요.
    </div>
  </div>
  
  <a href="/" class="back-link">← 웹사이트로 돌아가기</a>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginBtn = document.getElementById('login-btn');
      const passwordInput = document.getElementById('password');
      const errorMessage = document.getElementById('error-message');
      
      // 관리자 비밀번호
      const correctPassword = "Sbdyzj12";
      
      // 엔터키 지원
      passwordInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          checkPassword();
        }
      });
      
      // 로그인 버튼 클릭 이벤트
      loginBtn.addEventListener('click', checkPassword);
      
      // 비밀번호 확인 함수
      function checkPassword() {
        const password = passwordInput.value;
        
        if (password === correctPassword) {
          // 로그인 성공 - 세션 스토리지에 인증 상태 저장
          sessionStorage.setItem('adminAuthenticated', 'true');
          
          // 관리자 페이지로 이동
          window.location.href = './admin.html';
        } else {
          // 로그인 실패
          errorMessage.style.display = 'block';
          passwordInput.value = '';
          
          // 3초 후 에러 메시지 숨김
          setTimeout(() => {
            errorMessage.style.display = 'none';
          }, 3000);
        }
      }
      
      // 로고 및 사이트 제목 업데이트 (메인 페이지와 동일한 로고 사용)
      const savedLogoUrl = localStorage.getItem('siteLogoUrl');
      if (savedLogoUrl) {
        document.querySelector('.logo').src = savedLogoUrl;
      }
      
      const savedTitle = localStorage.getItem('siteTitle');
      if (savedTitle) {
        document.querySelector('h1').textContent = savedTitle;
        document.title = savedTitle + " - 관리자 로그인";
      }
    });
  </script>
</body>
</html>
